<!-- The favicon, tuned for the size it is actually seen at.

     A browser tab renders this at 16px. The kit's book mark is fine line-art,
     and below about 24px its strokes fall under a pixel and grey out into a
     smudge — the kit says as much, calling the tile version "noticeably
     clearer at 16-24px", but even that keeps the thin strokes.

     So this uses the kit's other mark: the compact blocky SR, which is solid
     rather than drawn, reversed out in white on the brand gradient. Solid
     shapes and a full-bleed gradient are what survive being drawn at 16px.
     Both the mark and the gradient are the kit's own; nothing here is new art. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="SmartRecap">
<title>SmartRecap</title>
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="64" y2="50"><stop offset="0" stop-color="#6C37CB"/><stop offset=".5" stop-color="#FC5096"/><stop offset="1" stop-color="#2FD2EB"/></linearGradient></defs>
