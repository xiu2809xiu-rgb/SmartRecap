# Runs the API on an EC2 instance with one command, from the repository root:
#
#   docker compose -f backend/docker-compose.yml up -d --build
#
# Reads secrets from backend/.env — the same file the bare-metal service uses,
# so there is one place to keep them and no second copy to drift.

services:
  api:
    build:
      # The repo root, because .dockerignore lives there and the Dockerfile
      # copies backend/app relative to it.
      context: ..
      dockerfile: backend/Dockerfile
    image: smartrecap-api:latest
    container_name: smartrecap-api

    # Bound to localhost only. nginx terminates the public connection and
    # proxies to 127.0.0.1:8000 — see backend/infra/nginx.conf. Publishing this
    # on 0.0.0.0 would expose the API directly, past nginx's request limits.
    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - .env

    # Survives a reboot, which on a Learner Lab instance happens more often
    # than you would like.
    restart: unless-stopped

    # OCR model weights, downloaded on first use. As a named volume they survive
    # `up --build`, so a redeploy does not re-download them and the first upload
    # after a deploy is not mistaken for a hang.
    volumes:
      - ocr-cache:/var/lib/smartrecap/cache

    # Uploaded documents are parsed in-process and some of the OCR paths are
    # memory-hungry. Without a cap, one pathological PDF can take the whole
    # instance down instead of failing one request.
    deploy:
      resources:
        limits:
          memory: 6g

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  ocr-cache:
