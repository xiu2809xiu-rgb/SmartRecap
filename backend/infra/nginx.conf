# nginx in front of the SmartRecap API on EC2.
#
# Two reasons it is worth the ten minutes:
#   1. The browser calls port 80, not 3000, so nothing in the frontend has to
#      carry a port number and no extra security-group rule is needed.
#   2. It is where TLS goes if you ever add it. Browsers block a plain-HTTP
#      fetch from an HTTPS page, so if the frontend ends up on HTTPS the API
#      must be too.
#
#   sudo cp infra/nginx.conf /etc/nginx/conf.d/smartrecap.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Remove the default server block first if it is still serving on 80:
#   sudo rm -f /etc/nginx/conf.d/default.conf

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Nothing posted to this API is large — the file itself goes straight to S3
    # with a presigned URL and never passes through here.
    client_max_body_size 1m;

    # Health check, so you can confirm the box is up without a token.
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A generation job is dispatched in the background and POST /jobs
        # returns straight away, so these do not need to cover the 20-40 second
        # pipeline. They do need to cover a slow Textract call on a scanned PDF.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # CORS is handled by the Express app, which knows the allowed origin.
        # Adding headers here as well produces duplicates, which browsers reject.
    }
}
